<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sales Academy Pro</title><style>
:root{--bg:#101113;--panel:#1a1c20;--line:#303137;--gold:#dfbd79;--muted:#a2a4ad;--white:#f3f1ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px/1.6 system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--gold)}aside{position:fixed;width:242px;inset:0 auto 0 0;background:#151619;border-right:1px solid var(--line);padding:28px 18px;overflow:auto}.brand{font-weight:800;letter-spacing:2px;font-size:17px;color:var(--gold)}.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:3px}.nav{margin-top:38px;display:grid;gap:5px}.nav button{background:none;border:0;color:var(--muted);text-align:left;padding:12px;border-radius:8px}.nav button.active,.nav button:hover{background:#28251f;color:var(--gold)}main{margin-left:242px;padding:32px 5%;max-width:1600px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:35px}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}h1{font-size:clamp(28px,4vw,46px);line-height:1.12;margin:12px 0}h2{font-size:23px;margin:28px 0 14px}h3{margin:0 0 8px;font-size:17px}p{color:var(--muted);margin:8px 0 18px}.hero{padding:36px;border:1px solid #554730;border-radius:20px;background:radial-gradient(ellipse at 90% 0%,#483822 0%,transparent 60%),linear-gradient(110deg,#202022,#151618)}.primary{background:var(--gold);color:#18150f;border:0;padding:11px 18px;border-radius:8px;font-weight:700}.secondary{background:transparent;color:var(--gold);border:1px solid #6a5838;padding:10px 16px;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:21px}.card p{font-size:14px}.metric{font-size:32px;font-weight:700;color:var(--gold)}.bar{height:7px;background:#34353a;border-radius:8px;overflow:hidden;margin:15px 0}.bar span{height:100%;background:var(--gold);display:block}.tag{display:inline-block;font-size:11px;color:var(--gold);letter-spacing:1px;margin-bottom:12px}select,textarea,input{background:#202226;color:var(--white);border:1px solid #45464d;border-radius:8px;padding:10px;max-width:100%}textarea{width:100%;min-height:100px}label.option{display:block;padding:12px;margin:7px 0;background:#24262b;border-radius:8px;cursor:pointer}label.option input{margin-right:10px}.stack{display:grid;gap:12px}.notice{border-left:3px solid var(--gold);padding:12px 16px;background:#25231e;margin:15px 0}.lesson{max-width:850px}.lesson li{margin:10px 0}.footer{color:var(--muted);font-size:12px;margin-top:40px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid var(--line);padding:12px 8px}th{color:var(--muted);font-size:12px}.scroll{overflow:auto}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.script{white-space:pre-wrap;color:var(--white)}@media(max-width:850px){aside{position:static;width:100%;padding:15px}.nav{display:flex;overflow:auto;margin-top:12px}.nav button{white-space:nowrap}main{margin:0;padding:20px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:24px}}@media(max-width:480px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.hero{padding:18px}}
</style></head><body><aside><div class="brand">SALES / ACADEMY<small>PRO • LEARNING SPACE</small></div><nav class="nav" id="nav"></nav></aside><main><header><div><span class="eyebrow">Корпоративная академия</span><div id="crumb">Рабочее пространство</div></div><select id="project" aria-label="Проект"><option>Универсальная академия</option><option>PULSE Forum</option><option>Justcars Premium Rent</option></select></header><div id="app"></div><div class="footer">SALES ACADEMY PRO · локальная демонстрационная версия · данные сохраняются в этом браузере</div></main><script>
const modules=[['Введение в компанию','Ценности, роль менеджера и стандарты работы',['Изучи продукт и целевую аудиторию до первого контакта.','Уточни правила коммуникации, рабочий график и ответственных.','В конце рабочего дня фиксируй результаты и следующие действия.'],'Что нужно сделать до первого контакта?',['Изучить продукт и аудиторию','Сразу предложить скидку','Отправить всем одинаковую ссылку'],0],['Основы продаж','Квалификация и выявление потребностей',['Начни с контекста обращения и открытого вопроса.','Выясни цель клиента, сроки, критерии выбора и бюджет, когда это уместно.','Предложи решение, связанное с запросом, и согласуй следующий шаг.'],'Что следует сделать перед презентацией?',['Назвать максимальную цену','Выявить потребность','Закрыть сделку в CRM'],1],['Продукт и тарифы','Презентация ценности и условий',['Используй только утвержденные цены и условия проекта.','Связывай характеристики продукта с потребностями клиента.','Не обещай неутвержденные скидки или гарантии.'],'Как поступить, если цена неизвестна?',['Придумать цену','Пообещать скидку','Уточнить актуальный прайс'],2],['Скрипты и коммуникация','Звонки, переписки и повторные касания',['Персонализируй первое сообщение и объясни повод обращения.','Задавай один понятный вопрос за раз.','После диалога согласуй дату следующего контакта.'],'Как закончить продуктивный диалог?',['Согласовать следующий шаг','Просто попрощаться','Отправить пять сообщений'],0],['Работа с возражениями','Цена, сомнения и конкуренты',['Признай сомнение клиента без спора.','Уточни, что именно вызывает сомнение.','Ответь по существу и проверь, решен ли вопрос.'],'Первый шаг при возражении «дорого»?',['Сразу снизить цену','Уточнить причину сомнения','Спорить с клиентом'],1],['CRM и отчётность','Воронка и дисциплина',['Фиксируй контакт и актуальный этап сделки.','Записывай договоренности и назначай следующую задачу.','Ежедневно проверяй просроченные задачи и результаты.'],'Что обязательно после разговора?',['Удалить лид','Оставить всё в памяти','Зафиксировать договоренности и задачу'],2],['Практика продаж','Симуляция и самопроверка',['Прочитай сценарий клиента в тренажере.','Составь ответ с уточняющим вопросом и следующим шагом.','Сравни свой ответ с примером и обсуди его с РОПом.'],'Что улучшает практику?',['Разбор ответа и обратная связь','Заучивание без контекста','Игнорирование ошибок'],0],['Итоговая аттестация','Подготовка к самостоятельной работе',['Повтори продукт, этапы сделки и регламенты.','Пройди проверку знаний по всем модулям.','Согласуй практическую аттестацию с руководителем.'],'Что нужно перед самостоятельной работой?',['Только прочитать скрипт','Пройти проверку и согласовать допуск','Сразу брать все лиды'],1]];
const navs=['Главная','Обучение','База знаний','Скрипты продаж','Тестирование','Тренажёр','Мои результаты','Кабинет РОПа','Настройки'];let page='Главная',project='Универсальная академия',state={};try{state=JSON.parse(localStorage.getItem('sap-v1')||'{}')}catch{};const app=document.querySelector('#app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function data(){return state[project]||(state[project]={done:[],answers:{},name:'Менеджер'})}function save(){try{localStorage.setItem('sap-v1',JSON.stringify(state))}catch{alert('Не удалось сохранить данные в браузере.')}}function go(p){page=p;render();window.scrollTo(0,0)}function pct(){return Math.round(data().done.length/8*100)}function nav(){document.querySelector('#nav').innerHTML=navs.map(n=>`<button class="${page===n?'active':''}" onclick="go('${n}')">${n}</button>`).join('');document.querySelector('#crumb').textContent=page}function course(i){let m=modules[i];return `<div class="card"><span class="tag">МОДУЛЬ ${String(i+1).padStart(2,'0')} ${data().done.includes(i)?'· ✓ ПРОЙДЕН':''}</span><h3>${m[0]}</h3><p>${m[1]}</p><button class="secondary" onclick="openLesson(${i})">${data().done.includes(i)?'Повторить':'Открыть урок'} →</button></div>`}function metrics(){return `<div class="grid"><div class="card"><span class="eyebrow">Прогресс</span><div class="metric">${pct()}%</div><div class="bar"><span style="width:${pct()}%"></span></div></div><div class="card"><span class="eyebrow">Уроки</span><div class="metric">${data().done.length} / 8</div><p>Пройдено модулей</p></div><div class="card"><span class="eyebrow">Тесты</span><div class="metric">${Object.values(data().answers).filter(Boolean).length} / 8</div><p>Верные ответы</p></div></div>`}
function render(){nav();let d=data();if(page==='Главная'){let next=modules.findIndex((_,i)=>!d.done.includes(i));app.innerHTML=`<section class="hero"><span class="eyebrow">Развитие · Практика · Результат</span><h1>Твой следующий<br>уровень в продажах.</h1><p>Добро пожаловать, ${esc(d.name)}. Освой продукт, коммуникацию и систему продаж.</p><button class="primary" onclick="${next<0?"go('Тестирование')":`openLesson(${next})`}">${next<0?'Пройти тестирование':'Продолжить обучение'} →</button></section><h2>Твои показатели</h2>${metrics()}<h2>Программа обучения</h2><div class="grid">${modules.map((_,i)=>course(i)).join('')}</div>`}else if(page==='Обучение'){app.innerHTML=`<h1>Программа обучения</h1><p>Восемь модулей для подготовки менеджера.</p><div class="grid">${modules.map((_,i)=>course(i)).join('')}</div>`}else if(page==='База знаний'){app.innerHTML=`<h1>База знаний</h1><p>Стартовые стандарты. Проектные регламенты и тарифы необходимо загрузить отдельно.</p><div class="stack">${[ ['Стандарт обработки лида','Уточнить запрос, зафиксировать контакт в CRM, согласовать следующий шаг.'],['Ежедневный контроль','Проверить новые лиды и просроченные задачи, внести результаты в отчет.'],['Правила ценообразования','Использовать утвержденный прайс; согласовывать исключения с руководителем.'],['Проект: '+project,project==='PULSE Forum'?'Программа форума, тарифы и условия оплаты — материалы ожидают загрузки.':project==='Justcars Premium Rent'?'Каталог, условия аренды и актуальные предложения — материалы ожидают загрузки.':'Добавьте продуктовые инструкции для своего проекта.']].map(x=>`<div class="card"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></div>`).join('')}</div>`}else if(page==='Скрипты продаж'){app.innerHTML=`<h1>Скрипты продаж</h1><p>Универсальные шаблоны для адаптации под продукт.</p><div class="stack">${scripts.map((x,i)=>`<div class="card"><h3>${x[0]}</h3><p class="script" id="script${i}">${esc(x[1])}</p><button class="secondary" onclick="copyScript(${i})">Копировать</button></div>`).join('')}</div>`}else if(page==='Тестирование'){app.innerHTML=`<h1>Проверка знаний</h1><p>8 вопросов. Выбери один вариант в каждом.</p><form id="quiz" class="stack">${modules.map((m,i)=>`<div class="card"><span class="tag">ВОПРОС ${i+1}</span><h3>${m[3]}</h3>${m[4].map((a,j)=>`<label class="option"><input required type="radio" name="q${i}" value="${j}">${a}</label>`).join('')}</div>`).join('')}<button class="primary">Проверить ответы</button></form><div id="quizResult" aria-live="polite"></div>`;document.querySelector('#quiz').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);modules.forEach((m,i)=>d.answers[i]=Number(f.get('q'+i))===m[5]);save();let score=Object.values(d.answers).filter(Boolean).length;document.querySelector('#quizResult').innerHTML=`<div class="notice"><strong>Результат: ${score} из 8.</strong><p>${score>=7?'Теоретический тест пройден. Практический допуск согласует РОП.':'Повтори модули: '+modules.filter((_,i)=>!d.answers[i]).map(m=>m[0]).join(', ')}</p></div>`;document.querySelector('#quizResult').scrollIntoView({behavior:'smooth'})}}else if(page==='Тренажёр'){app.innerHTML=`<h1>Тренажёр диалогов</h1><p>Локальная практика по сценариям. ИИ-модель пока не подключена.</p><div class="card"><label>Сценарий <select id="scenario" onchange="scenarioChange()">${scenarios.map((s,i)=>`<option value="${i}">${s[0]}</option>`).join('')}</select></label><div class="notice" id="client"></div><label for="reply">Твой ответ менеджера</label><textarea id="reply" placeholder="Напиши ответ клиенту..."></textarea><button class="primary" onclick="feedback()">Получить самопроверку</button><div id="feedback" aria-live="polite"></div></div>`;scenarioChange()}else if(page==='Мои результаты'){app.innerHTML=`<h1>Мои результаты</h1>${metrics()}<h2>Статус модулей</h2><div class="card scroll"><table><thead><tr><th>Модуль</th><th>Урок</th><th>Тест</th></tr></thead><tbody>${modules.map((m,i)=>`<tr><td>${m[0]}</td><td>${d.done.includes(i)?'Пройден':'Не пройден'}</td><td>${d.answers[i]===undefined?'—':d.answers[i]?'Верно':'Ошибка'}</td></tr>`).join('')}</tbody></table></div>`}else if(page==='Кабинет РОПа'){app.innerHTML=`<h1>Кабинет руководителя</h1><div class="notice">Демонстрационный режим: отображается только локальный профиль, без общей базы сотрудников и разграничения прав.</div>${metrics()}<h2>Контроль подготовки</h2><div class="card scroll"><table><tr><th>Менеджер</th><th>Прогресс</th><th>Тест</th><th>Допуск</th></tr><tr><td>${esc(d.name)}</td><td>${pct()}%</td><td>${Object.values(d.answers).filter(Boolean).length}/8</td><td>Решение РОПа</td></tr></table><br><button class="secondary" onclick="exportReport()">Скачать отчёт CSV</button></div>`}else if(page==='Настройки'){app.innerHTML=`<h1>Настройки профиля</h1><form id="profile" class="card"><label>Имя менеджера<br><input id="name" required maxlength="80" value="${esc(d.name)}"></label><p>Профиль и прогресс хранятся на этом устройстве отдельно для каждого проекта.</p><button class="primary">Сохранить</button></form>`;document.querySelector('#profile').onsubmit=e=>{e.preventDefault();d.name=document.querySelector('#name').value.trim()||'Менеджер';save();go('Главная')}}}
function openLesson(i){page='Обучение';nav();let m=modules[i];app.innerHTML=`<div class="lesson"><button class="secondary" onclick="go('Обучение')">← Все модули</button><h1>${m[0]}</h1><p>${m[1]}</p><div class="card"><h3>Ключевые правила</h3><ol>${m[2].map(x=>`<li>${x}</li>`).join('')}</ol></div><h2>Практическое задание</h2><div class="card"><p>Запиши пример применения этих правил к своему проекту и обсуди его с руководителем.</p><textarea id="notes" placeholder="Личные заметки">${esc((data().notes||{})[i]||'')}</textarea><div class="row"><button class="secondary" onclick="saveNotes(${i})">Сохранить заметки</button><button class="primary" onclick="finish(${i})">${data().done.includes(i)?'✓ Пройден · Далее':'Завершить урок'}</button></div></div></div>`;window.scrollTo(0,0)}function saveNotes(i){let d=data();(d.notes||(d.notes={}))[i]=document.querySelector('#notes').value;save();}function finish(i){saveNotes(i);let d=data();if(!d.done.includes(i))d.done.push(i);save();i<7?openLesson(i+1):go('Тестирование')}
const scripts=[['Первое касание','Здравствуйте! Меня зовут [имя], я представляю [компания]. Подскажите, пожалуйста, что для вас наиболее важно при выборе [продукта]?'],['Возражение «Дорого»','Понимаю. Подскажите, вы сравниваете с другим предложением или ориентируетесь на определённый бюджет?'],['Повторное касание','Здравствуйте! Возвращаюсь к нашему разговору. Остались ли вопросы по предложению? Буду рад помочь определиться.'],['Согласование следующего шага','Давайте договоримся о следующем шаге. Когда вам будет удобно вернуться к обсуждению?']];async function copyScript(i){try{await navigator.clipboard.writeText(scripts[i][1]);alert('Скопировано')}catch{let r=document.createRange();r.selectNodeContents(document.querySelector('#script'+i));let s=getSelection();s.removeAllRanges();s.addRange(r);alert('Текст выделен. Нажмите Ctrl+C или скопируйте через меню.')}}const scenarios=[['Дорого','У конкурентов дешевле. Зачем мне переплачивать?','Понимаю, важно выбрать выгодное предложение. Подскажите, что входит в стоимость у конкурента и какие условия для вас наиболее важны?'],['Я подумаю','Спасибо, я подумаю и сам напишу.','Конечно. Подскажите, остался ли вопрос, который мешает принять решение? Когда будет удобно вернуться к обсуждению?'],['Нет времени','Сейчас некогда разговаривать.','Понимаю. Когда вам будет удобно, чтобы я связался с вами? Могу также отправить краткую информацию сообщением.']];function scenarioChange(){document.querySelector('#client').textContent='Клиент: '+scenarios[Number(document.querySelector('#scenario').value)][1];document.querySelector('#feedback').innerHTML='';document.querySelector('#reply').value=''}function feedback(){let r=document.querySelector('#reply').value.trim();if(!r){document.querySelector('#feedback').textContent='Сначала напиши ответ.';return}let s=scenarios[Number(document.querySelector('#scenario').value)];document.querySelector('#feedback').innerHTML=`<div class="notice"><strong>Самопроверка (по простым правилам)</strong><p>${r.includes('?')?'Есть вопрос клиенту.':'Добавь уточняющий вопрос.'} ${r.length>300?'Попробуй сделать ответ короче.':'Проверь, что ответ конкретный и вежливый.'}</p><strong>Пример ответа:</strong><p>${s[2]}</p><p>Проверь: признал ли ты сомнение, уточнил ли причину и согласовал ли следующий шаг?</p></div>`}function exportReport(){let d=data();let cell=x=>'"'+String(x).replace(/^[=+\-@\t\r]/,"'$&").replace(/"/g,'""')+'"';let csv='\ufeff'+[['Проект','Менеджер','Модуль','Урок','Тест'],...modules.map((m,i)=>[project,d.name,m[0],d.done.includes(i)?'Пройден':'Не пройден',d.answers[i]===undefined?'Не сдан':d.answers[i]?'Верно':'Ошибка'])].map(r=>r.map(cell).join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='sales-academy-report.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.querySelector('#project').onchange=e=>{project=e.target.value;go('Главная')};render();</script></body></html>
